name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Most of what is worth checking needs no GPU: the analytic scene library, the
  # bound soundness proofs and the pose covariance parity are host arithmetic.
  # The rest is labelled "gpu" and skipped here; run ctest without -LE on a
  # machine that has one.
  build-and-test:
    name: build and test (no GPU)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - name: install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git ninja-build \
            libeigen3-dev libgtest-dev libyaml-cpp-dev \
            pybind11-dev python3-dev python3-numpy python3-pytest
      - uses: actions/checkout@v4
      - name: configure
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="75;86;89" \
            -DCUDA_DEPTH_BUFFER_BUILD_TESTS=ON \
            -DCUDA_DEPTH_BUFFER_BUILD_EXAMPLES=ON \
            -DCUDA_DEPTH_BUFFER_BUILD_BENCHMARK=ON \
            -DCUDA_DEPTH_BUFFER_BUILD_PYTHON=ON
      - name: build
        run: cmake --build build -j "$(nproc)"
      - name: test
        run: ctest --test-dir build --output-on-failure -LE gpu
      - name: install and consume from another project
        run: |
          cmake --install build --prefix /tmp/prefix
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(consumer LANGUAGES CXX)
          find_package(cuda_depth_buffer REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE mrl::cuda_depth_buffer)
          CMAKE
          cat > /tmp/consumer/main.cpp <<'CPP'
          #include <mrl/cuda_depth_buffer/depth_buffer.hpp>
          #include <mrl/cuda_depth_buffer/scene.hpp>
          int main() {
            const mrl::AnalyticScene scene = mrl::AnalyticScene::forest(1);
            return scene.cylinders.empty() ? 1 : 0;
          }
          CPP
          cmake -S /tmp/consumer -B /tmp/consumer/build \
            -DCMAKE_PREFIX_PATH=/tmp/prefix
          cmake --build /tmp/consumer/build
          /tmp/consumer/build/consumer

  ros:
    name: ros 2 package
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - name: install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake curl git gnupg ninja-build \
            libeigen3-dev libyaml-cpp-dev pybind11-dev python3-dev
          curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main" \
            > /etc/apt/sources.list.d/ros2.list
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-jazzy-ros-base ros-jazzy-rclcpp-components ros-jazzy-tf2-ros \
            python3-colcon-common-extensions
      - uses: actions/checkout@v4
      - name: install the library
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/cuda_depth_buffer \
            -DCMAKE_CUDA_ARCHITECTURES="75;86;89" \
            -DCUDA_DEPTH_BUFFER_BUILD_TESTS=OFF \
            -DCUDA_DEPTH_BUFFER_BUILD_EXAMPLES=OFF
          cmake --build build --target install -j "$(nproc)"
      - name: colcon build
        run: |
          . /opt/ros/jazzy/setup.sh
          CMAKE_PREFIX_PATH=/opt/cuda_depth_buffer:$CMAKE_PREFIX_PATH \
            colcon build --base-paths ros --cmake-args -DCMAKE_BUILD_TYPE=Release

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          pipx install ruff
      - name: clang-format
        run: |
          git ls-files '*.cpp' '*.hpp' '*.cu' '*.cuh' \
            | xargs clang-format-18 --style=file --dry-run --Werror
      - name: ruff
        run: ruff check .

  # The GPU half of the suite: the depth buffer itself, its concurrency and
  # the system tests against the analytic scenes. The lab's runner has the
  # card; the container gets it through the nvidia runtime. It runs in the
  # private development repository only, because a self-hosted runner must not
  # execute pull requests to the public one.
  build-and-test-gpu:
    name: build and test (GPU, lab runner)
    if: github.repository == 'ethz-mrl/cuda-depth-buffer'
    runs-on: [self-hosted-linux-gpu]
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu24.04
      options: --gpus all
    steps:
      - name: install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git ninja-build \
            libeigen3-dev libgtest-dev libyaml-cpp-dev
      - uses: actions/checkout@v4
      - name: configure
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=native \
            -DCUDA_DEPTH_BUFFER_BUILD_TESTS=ON \
            -DCUDA_DEPTH_BUFFER_BUILD_EXAMPLES=OFF \
            -DCUDA_DEPTH_BUFFER_BUILD_BENCHMARK=OFF \
            -DCUDA_DEPTH_BUFFER_BUILD_PYTHON=OFF
      - name: build
        run: cmake --build build -j "$(nproc)"
      - name: test, GPU tests included
        run: ctest --test-dir build --output-on-failure
